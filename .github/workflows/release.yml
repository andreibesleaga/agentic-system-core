# The engine release lane of docs/PLAN.md §7.
#
#   Trigger    a tag `v*` pushed by the maintainer (`v1.0.0`). The
#              specification's own tag (`1.0.0`, no `v`; only when the specification
#              moved, never for a package-only patch) sits on the same
#              commit and triggers nothing. A manual run (workflow_dispatch)
#              publishes a version whose `v` tag already exists, from `main`,
#              and only when every file the packages ship is byte-identical to
#              that tag's (a tag never moves; this is how a release whose tag
#              run failed on a test-only defect is published). Nothing here runs on a push to a
#              branch, on a pull request, or on `pull_request_target` (never —
#              docs/PLAN.md §7).
#   Secrets    none. Both packages publish over npm TRUSTED PUBLISHING (OIDC), so
#              no NPM_TOKEN exists in this repository and none is read here.
#   Provenance `actions/attest-build-provenance` attests each tarball, and
#              `npm publish --provenance` records the build on the registry.
#   On main    The publish job reads the whole history and refuses a tag whose
#              commit is not on `main`: with release branches, a tag pushed on a
#              branch head before its pull request is merged would otherwise
#              publish a commit `main` does not have.
#   Dist-tag   Chosen from the version: a pre-release (`1.1.0-rc.1`) is published
#              under `next`, a final release (`1.0.0`) under `latest`, so a later
#              release candidate never takes `latest` from a final release.
#
# Every action is pinned to a commit SHA with the version beside it, so that a
# moved tag cannot change what runs (docs/PLAN.md §7). Each SHA was read from the
# action's own repository (GitHub API `git/ref/tags/<tag>`) on 2026-09-24; all
# three run on Node 24.
#
# The gates below are the same ones `tools/release` checks locally and the same
# ones the maintainer's checklist runs before the tag is pushed. test.yml runs each
# of them, under the same condition, on every push of the commit the tag names:
# on Ubuntu × Node 24 the suite runs measured, with the coverage thresholds of
# package.json, and every leg installs the two packed tarballs together.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'An already tagged version to publish, without the v (e.g. 1.0.0); its tag v<version> must exist'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: gates (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13.0', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run arch
      - run: npm run duplicates
      - if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == '24') }}
        run: npm test
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run test:coverage
      - run: npm audit --audit-level=low
      - run: node tools/rule-coverage --check
      - run: node tools/requirements-matrix --check
      - run: node tools/count-artifacts --json
      - name: the independent validators of AGSC-09-90
        shell: bash
        run: |
          # Every validator BLOCKS: a gate that reports and does not block
          # protects nothing.
          # validate-wellknown checks one built discovery document, so it runs in
          # the next step against a fixture build instead of with no argument.
          for t in tools/validate-*; do
            case "$t" in */validate-wellknown) continue ;; esac
            node "$t" --json
          done
      - name: the discovery document of a fixture build
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1767225600'
        run: |
          # The fixture has no git history, so it publishes no ledger: Level 1.
          fx="$RUNNER_TEMP/fixture"
          cp -r tests/fixtures/minimal "$fx"
          (cd "$fx" && node "$GITHUB_WORKSPACE/bin/agsc.js" build)
          node tools/validate-wellknown "$fx/www/.well-known/knowledge-linkset" --level 1 --json
      - name: the packed install (both tarballs, installed together in an empty folder)
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          dest="$RUNNER_TEMP/packed"
          mkdir -p "$dest/install"
          npm pack --pack-destination "$dest"
          npm pack --pack-destination "$dest" ./packages/agsc-cli
          cd "$dest/install"
          printf '{ "private": true }\n' > package.json
          npm install --no-audit --no-fund "$dest/agentic-system-core-$version.tgz" "$dest/agsc-cli-$version.tgz"
          test "$(npx --no-install agsc --version | tr -d '\r')" = "agsc $version"
          test "$(npx --no-install agentic-system-core --version | tr -d '\r')" = "agsc $version"
          test "$(npx --no-install agsc-cli --version | tr -d '\r')" = "agsc $version"
          test "$(node node_modules/agsc-cli/bin/agsc.js --version | tr -d '\r')" = "agsc $version"
      - name: the release lane's own checks
        run: node tools/release --json
      - name: public means clean (the whole tree, not only what ships)
        run: node tools/public-hygiene
      - name: the architecture boundary lane
        env:
          AGSC_AUDIT: '1'
        run: node --test "tests/arch/*.test.js"

  publish:
    name: publish (npm trusted publishing)
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the step "the tagged commit is on main" reads ancestry.
          fetch-depth: 0
      # npm trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0
      # (docs.npmjs.com/trusted-publishers). Node 24 ships a newer npm, so keep
      # this job on 24 even though the engine itself supports Node >= 22.13.0.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # This job holds `id-token: write`, so no dependency's install script may run in
      # it; packing and publishing need none.
      - run: npm ci --ignore-scripts

      - name: the tag and package.json must agree
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main" || { echo "a manual run publishes from main only, not $GITHUB_REF"; exit 1; }
            tag="$INPUT_VERSION"
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || { echo "tag $tag != package.json $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # The dist-tag follows the version (build metadata after `+` aside): a
          # pre-release goes to `next`, a final release to `latest`.
          case "${version%%+*}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "DIST_TAG=$dist_tag" >> "$GITHUB_ENV"
          echo "publishing $version under the dist-tag $dist_tag"

      # On a tag push $GITHUB_SHA is the tag's commit, but on a manual run it is the
      # head of main, so the commit checked is always the one the tag names.
      - name: the tagged commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/v$VERSION:refs/tags/v$VERSION"
          commit="$(git rev-parse "v$VERSION^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main || { echo "v$VERSION names $commit, which is not on main"; exit 1; }
          echo "v$VERSION names $commit, which is on main"

      - name: a manual run ships exactly the tagged files
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          # The tag was fetched by the step before.
          mapfile -t paths < <(node -e "for (const f of ['package.json', 'packages/agsc-cli', ...require('./package.json').files]) console.log(f)")
          git diff --stat "refs/tags/v$VERSION" HEAD -- "${paths[@]}"
          git diff --quiet "refs/tags/v$VERSION" HEAD -- "${paths[@]}" || { echo "shipped files differ from tag v$VERSION"; exit 1; }
          echo "every shipped file equals tag v$VERSION"

      - name: pack both packages
        run: |
          npm pack --pack-destination .
          npm pack --pack-destination . ./packages/agsc-cli

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.tgz'

      # `--tag` is always stated rather than left to the default. npm's own
      # documentation (docs.npmjs.com/cli/v11/commands/npm-dist-tag, read 2026-09-22)
      # says "Publishing a package sets the `latest` tag to the published version
      # unless the `--tag` option is used", and adds "Typically, projects only use the
      # `latest` tag for stable release versions, and use other tags for unstable
      # versions such as prereleases". So the value is DIST_TAG, chosen from the
      # version above: `next` for a pre-release, `latest` for a final release.
      # The tarballs published are the ones attested above — one `npm pack` per
      # package, then `npm publish <file>` — so the attested bytes and the registry's
      # bytes are the same file by construction, not two packs of one tree.
      # Each publish step first asks the registry whether this exact version is already
      # there and, if it is, does nothing: npm refuses to publish over an existing
      # version, so without the check a re-run after the alias failed — "Re-run failed
      # jobs" or the manual dispatch — would stop at the engine and the alias could only
      # go out by hand, without provenance. The real publish keeps `--provenance`.
      - name: publish the engine (the attested tarball)
        shell: bash
        run: |
          if [ "$(npm view "agentic-system-core@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
            echo "agentic-system-core@${VERSION} is already on npm; nothing to publish"
          else
            npm publish --provenance --access public --tag "${DIST_TAG}" "./agentic-system-core-${VERSION}.tgz"
          fi

      - name: publish the alias (the attested tarball)
        shell: bash
        run: |
          if [ "$(npm view "agsc-cli@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
            echo "agsc-cli@${VERSION} is already on npm; nothing to publish"
          else
            npm publish --provenance --access public --tag "${DIST_TAG}" "./agsc-cli-${VERSION}.tgz"
          fi
