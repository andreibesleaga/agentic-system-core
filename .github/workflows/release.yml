# The engine release lane of docs/PLAN.md §7.
#
#   Trigger    a tag `v*` pushed BY THE OWNER. Nothing here runs on a push to a
#              branch, on a pull request, or on `pull_request_target` (never —
#              docs/PLAN.md §7).
#   Secrets    none. Both packages publish over npm TRUSTED PUBLISHING (OIDC), so
#              no NPM_TOKEN exists in this repository and none is read here.
#   Provenance `actions/attest-build-provenance` attests each tarball, and
#              `npm publish --provenance` records the build on the registry.
#
# Every action is pinned to a commit SHA with the version beside it, so that a
# moved tag cannot change what runs (docs/PLAN.md §7, D40 items 2, 3, 11).
#
# The gates below are the same ones `tools/release` checks locally and the same
# ones the owner's checklist runs before the tag is pushed.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: gates (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=low
      - run: node tools/count-artifacts --json
      - name: the independent validators of AGSC-09-90
        shell: bash
        run: |
          # `validate-spec` is a REPORTING step until the specification items it
          # finds are applied at 1.0.0 (ENG4-01…05); every other validator blocks.
          for t in tools/validate-*; do
            if [ "$t" = "tools/validate-spec" ]; then
              node "$t" --json || echo "REPORT: $t exits 1 on the frozen text (ENG4-01…05)"
            else
              node "$t" --json
            fi
          done
      - name: the release lane's own checks
        run: node tools/release --json
      - name: the architecture boundary lane
        env:
          AGSC_AUDIT: '1'
        run: node --test tests/arch/*.test.js

  publish:
    name: publish (npm trusted publishing)
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci

      - name: the tag and package.json must agree
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || { echo "tag $tag != package.json $version"; exit 1; }

      - name: pack both packages
        run: |
          npm pack --pack-destination .
          npm pack --pack-destination . ./packages/agsc-cli

      - name: attest build provenance
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-path: '*.tgz'

      - name: publish the engine
        run: npm publish --provenance --access public

      - name: publish the alias
        run: npm publish --provenance --access public ./packages/agsc-cli
