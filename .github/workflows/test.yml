# The test lane: the whole suite on three operating systems and three Node lines,
# on every push and every pull request, and once a week.
#
#   What runs  `npm ci`, the linter (`npm run lint`), the dependency rule
#              (`npm run arch`), `npm test` (unit, integration, architecture, the
#              conformance vectors, the acceptance scenarios, the tests of the
#              standard and the end-to-end tests that need nothing outside the
#              repository), the rule-coverage matrix in its checking mode, and
#              every shipped validator — the six that read the distribution, and
#              validate-wellknown at Level 1 and at Level 2 on builds of the
#              minimal fixture. It also runs every other gate step of release.yml,
#              word for word, on the same legs, so that a tag is never the
#              first time a gate runs: `npm audit`, the requirements matrix, the counting
#              tool, `tools/release --json`, the cleanliness check and the
#              architecture lane with AGSC_AUDIT=1; tests/standard/workflow.test.js
#              fails if the two lists drift apart.
#   Legs       Node 22.13.0 (the floor), 24 and 26 on each system. The six legs of
#              22.13.0 and 24 are the check contexts branch protection requires;
#              their job names never change. The Node 26 legs are new contexts and
#              are not required.
#   Coverage   On the required leg Ubuntu × Node 24 the suite runs as
#              `npm run test:coverage` in place of `npm test`: the same test files,
#              measured over src/, and the step fails below 99.9 % of lines, 99 % of
#              functions or 93 % of branches (the thresholds are in package.json;
#              tests/_coverage-bar.js compares them to the decimal, because Node's
#              own threshold flags read whole numbers only).
#   Packed     Every leg packs the engine and the alias package, installs the two
#   install    tarballs together in an empty folder and runs `agsc`,
#              `agentic-system-core` and the alias, each of which must print the
#              packed version. So the files npm would ship are installed on all
#              three systems before any tag, not first on the tag push.
#              A further job, on Ubuntu only, runs `actionlint` over the workflow
#              files themselves: the release binary of version 1.7.12, fetched from
#              its GitHub release and refused unless its SHA-256 is the one recorded
#              below (read from the release's checksums file on 2026-09-25).
#   Browser    One job on Ubuntu runs the browser lane (AGSC_BROWSER=1): the three
#              browser test files, none of which may skip, and the acceptance
#              scenarios, none of which may skip for want of the browser. playwright-core 1.61.1 comes from the
#              npm registry and chrome-headless-shell 149.0.7827.55 from Chrome for
#              Testing, each refused unless its SHA-256 is the one recorded below
#              (read on 2026-10-10; the registry's sha512 integrity of the same
#              tarball agrees). The job is not a check context branch protection
#              requires.
#   Weekly     A scheduled run every Monday, so that a new advisory or a changed
#              runner image is found in a week even when nothing is pushed. GitHub
#              turns a schedule off after 60 days with no activity in the
#              repository; it runs on the default branch.
#   Secrets    none. Permissions: read the repository, nothing else.
#   Determinism SOURCE_DATE_EPOCH is set for the fixture builds; the suite fixes
#              its own clocks and never reaches the network. The two audit
#              steps (`npm audit`, and the architecture lane under AGSC_AUDIT=1)
#              read the registry's advisory list, so a new advisory turns a push
#              red the day it is published — which is when the release would
#              have found it. The packed install reads the registry too, for the
#              engine's dependencies, as a user's install does, and the browser
#              and actionlint jobs fetch their pinned, checksummed downloads.
#
# Every action is pinned to a commit SHA with the version beside it; the SHAs are
# the ones release.yml pins.

name: test

on:
  push:
    # Every branch; a release tag is exercised by release.yml's own gates job,
    # which runs the same steps, so a tag push does not run the matrix twice.
    branches:
      - '**'
  pull_request:
  schedule:
    # Mondays at 04:17 UTC.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13.0', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: install
        run: npm ci
      - name: lint (zero warnings; style, require order, size budgets)
        run: npm run lint
      - name: duplicates (jscpd, threshold 2 %)
        run: npm run duplicates
      - name: architecture (the dependency rule, by dependency-cruiser)
        run: npm run arch
      - name: suite
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == '24') }}
        run: npm test
      - name: suite, measured (coverage of src/ at 99.9 % lines, 99 % functions, 93 % branches)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run test:coverage
      - name: dependency advisories (the release gate's npm audit)
        run: npm audit --audit-level=low
      - name: rule coverage (no unverified rule, matrix current)
        run: node tools/rule-coverage --check
      - name: requirements matrix (no unmapped requirement)
        run: node tools/requirements-matrix --check
      - name: counting tool (the counts, never typed by hand)
        run: node tools/count-artifacts --json
      - name: the independent validators of AGSC-09-90
        shell: bash
        run: |
          # Every validator BLOCKS: a gate that reports and does not block
          # protects nothing.
          # validate-wellknown checks one built discovery document, so it runs in
          # the next step against a fixture build instead of with no argument.
          for t in tools/validate-*; do
            case "$t" in */validate-wellknown) continue ;; esac
            node "$t" --json
          done
      - name: the discovery document of a fixture build
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1767225600'
        run: |
          # The fixture has no git history, so it publishes no ledger: Level 1.
          fx="$RUNNER_TEMP/fixture"
          cp -r tests/fixtures/minimal "$fx"
          (cd "$fx" && node "$GITHUB_WORKSPACE/bin/agsc.js" build)
          node tools/validate-wellknown "$fx/www/.well-known/knowledge-linkset" --level 1 --json
      - name: validate-wellknown at Level 2 on a build of the minimal fixture
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1767225600'
          GIT_AUTHOR_NAME: Operator
          GIT_AUTHOR_EMAIL: operator@example.org
          GIT_AUTHOR_DATE: '2026-01-01T00:00:00Z'
          GIT_COMMITTER_NAME: Operator
          GIT_COMMITTER_EMAIL: operator@example.org
          GIT_COMMITTER_DATE: '2026-01-01T00:00:00Z'
        run: |
          work="$RUNNER_TEMP/minimal"
          cp -R tests/fixtures/minimal "$work"
          # A Level-2 node publishes its ledger, which derives from a history (AGSC-10-04).
          (cd "$work" && git init -q -b main && git add -A && git commit -q -m fixture \
            && node "$GITHUB_WORKSPACE/bin/agsc.js" build)
          node tools/validate-wellknown "$work/www/.well-known/knowledge-linkset" --level 2
      - name: the packed install (both tarballs, installed together in an empty folder)
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          dest="$RUNNER_TEMP/packed"
          mkdir -p "$dest/install"
          npm pack --pack-destination "$dest"
          npm pack --pack-destination "$dest" ./packages/agsc-cli
          cd "$dest/install"
          printf '{ "private": true }\n' > package.json
          npm install --no-audit --no-fund "$dest/agentic-system-core-$version.tgz" "$dest/agsc-cli-$version.tgz"
          test "$(npx --no-install agsc --version | tr -d '\r')" = "agsc $version"
          test "$(npx --no-install agentic-system-core --version | tr -d '\r')" = "agsc $version"
          test "$(npx --no-install agsc-cli --version | tr -d '\r')" = "agsc $version"
          test "$(node node_modules/agsc-cli/bin/agsc.js --version | tr -d '\r')" = "agsc $version"
      - name: the release lane's own checks
        run: node tools/release --json
      - name: public means clean (the whole tree, not only what ships)
        run: node tools/public-hygiene
      - name: the architecture boundary lane
        env:
          AGSC_AUDIT: '1'
        run: node --test "tests/arch/*.test.js"

  browser:
    name: browser (ubuntu-latest, chrome-headless-shell 149.0.7827.55)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: install
        run: npm ci
      - name: fetch playwright-core 1.61.1 and chrome-headless-shell 149.0.7827.55 and verify their checksums before use
        shell: bash
        run: |
          set -euo pipefail
          # playwright-core has no dependencies: its tarball is unpacked outside the
          # repository and reached through NODE_PATH, so no install script runs.
          pw="$RUNNER_TEMP/pw/node_modules/playwright-core"
          mkdir -p "$pw"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/playwright-core.tgz" "https://registry.npmjs.org/playwright-core/-/playwright-core-1.61.1.tgz"
          echo "3740bba3a3e93b4c7bd7c0f6e3c0e5f8cdce498bef13511e4d534cc99a8ce198  $RUNNER_TEMP/playwright-core.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/playwright-core.tgz" -C "$pw" --strip-components=1
          curl -sSL --retry 3 -o "$RUNNER_TEMP/chrome-headless-shell.zip" "https://storage.googleapis.com/chrome-for-testing-public/149.0.7827.55/linux64/chrome-headless-shell-linux64.zip"
          echo "410c9407d5de3fea80d9398666be06f2aa09154a3fa7b327dc254e336bb4c4b7  $RUNNER_TEMP/chrome-headless-shell.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/chrome-headless-shell.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/chrome-headless-shell-linux64/chrome-headless-shell" --version
      - name: the browser test files (none may skip)
        shell: bash
        env:
          AGSC_BROWSER: '1'
          CHROME_EXE: ${{ runner.temp }}/chrome-headless-shell-linux64/chrome-headless-shell
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tests/e2e/browser.test.js tests/e2e/modes/browser.test.js tests/distribution/search-page-browser.test.js | tee "$RUNNER_TEMP/browser.tap"
          # A browser that failed to start would make these tests skip, not fail.
          grep -qx '# skipped 0' "$RUNNER_TEMP/browser.tap" || { echo "a browser test skipped: the browser lane did not run"; exit 1; }
      - name: the acceptance scenarios, with the browser present
        shell: bash
        env:
          AGSC_BROWSER: '1'
          CHROME_EXE: ${{ runner.temp }}/chrome-headless-shell-linux64/chrome-headless-shell
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tests/acceptance/features.test.js | tee "$RUNNER_TEMP/acceptance-browser.tap"
      - name: no scenario that needs the browser was skipped
        # A browser that failed to start would make those scenarios skip, not fail.
        shell: bash
        run: |
          tap="$RUNNER_TEMP/acceptance-browser.tap"
          if grep -q '# SKIP not available here (browser)' "$tap"; then
            echo "::error::a scenario that needs the browser was skipped, so the browser lane did not run it"
            exit 1
          fi
          if ! grep -qE '^# pass [1-9][0-9]*$' "$tap"; then
            echo "::error::no acceptance scenario passed in the browser lane"
            exit 1
          fi

  actionlint:
    name: actionlint (the workflow files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch actionlint 1.7.12 and verify its checksum before it runs
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          sha="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" "$url"
          echo "$sha  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: every workflow file of this repository
        shell: bash
        # The shellcheck and pyflakes integrations are off so that the run here is the
        # same run a maintainer gets from the binary on one machine; turn them on once
        # their findings have been read.
        run: '"$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml'
