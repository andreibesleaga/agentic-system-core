# The test lane: the whole suite on three operating systems and two Node lines,
# on every push and every pull request.
#
#   What runs  `npm ci`, the linter (`npm run lint`), the dependency rule
#              (`npm run arch`), `npm test` (unit, integration, architecture, the
#              conformance vectors, the acceptance scenarios, the tests of the
#              standard and the end-to-end tests that need nothing outside the
#              repository), the rule-coverage matrix in its checking mode, and
#              every shipped validator — the six that read the distribution, and
#              validate-wellknown at Level 1 and at Level 2 on builds of the
#              minimal fixture. It also runs every other gate step of release.yml,
#              word for word, on the same six legs, so that a tag is never the
#              first time a gate runs: `npm audit`, the requirements matrix, the counting
#              tool, `tools/release --json`, the cleanliness check and the
#              architecture lane with AGSC_AUDIT=1; tests/standard/workflow.test.js
#              fails if the two lists drift apart.
#              A seventh job, on Ubuntu only, runs `actionlint` over the workflow
#              files themselves: the release binary of version 1.7.12, fetched from
#              its GitHub release and refused unless its SHA-256 is the one recorded
#              below (read from the release's checksums file on 2026-09-25).
#   Secrets    none. Permissions: read the repository, nothing else.
#   Determinism SOURCE_DATE_EPOCH is set for the fixture builds; the suite fixes
#              its own clocks and never reaches the network. The two audit
#              steps (`npm audit`, and the architecture lane under AGSC_AUDIT=1)
#              read the registry's advisory list, so a new advisory turns a push
#              red the day it is published — which is when the release would
#              have found it.
#
# Every action is pinned to a commit SHA with the version beside it; the SHAs are
# the ones release.yml pins.

name: test

on:
  push:
    # Every branch; a release tag is exercised by release.yml's own gates job,
    # which runs the same steps, so a tag push does not run the matrix twice.
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: install
        run: npm ci
      - name: lint (zero warnings; style, require order, size budgets)
        run: npm run lint
      - name: duplicates (jscpd, threshold 2 %)
        run: npm run duplicates
      - name: architecture (the dependency rule, by dependency-cruiser)
        run: npm run arch
      - name: suite
        run: npm test
      - name: dependency advisories (the release gate's npm audit)
        run: npm audit --audit-level=low
      - name: rule coverage (no unverified rule, matrix current)
        run: node tools/rule-coverage --check
      - name: requirements matrix (no unmapped requirement)
        run: node tools/requirements-matrix --check
      - name: counting tool (the counts, never typed by hand)
        run: node tools/count-artifacts --json
      - name: the independent validators of AGSC-09-90
        shell: bash
        run: |
          # Every validator BLOCKS: a gate that reports and does not block
          # protects nothing.
          # validate-wellknown checks one built discovery document, so it runs in
          # the next step against a fixture build instead of with no argument.
          for t in tools/validate-*; do
            case "$t" in */validate-wellknown) continue ;; esac
            node "$t" --json
          done
      - name: the discovery document of a fixture build
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1767225600'
        run: |
          # The fixture has no git history, so it publishes no ledger: Level 1.
          fx="$RUNNER_TEMP/fixture"
          cp -r tests/fixtures/minimal "$fx"
          (cd "$fx" && node "$GITHUB_WORKSPACE/bin/agsc.js" build)
          node tools/validate-wellknown "$fx/www/.well-known/knowledge-linkset" --level 1 --json
      - name: validate-wellknown at Level 2 on a build of the minimal fixture
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1767225600'
          GIT_AUTHOR_NAME: Operator
          GIT_AUTHOR_EMAIL: operator@example.org
          GIT_AUTHOR_DATE: '2026-01-01T00:00:00Z'
          GIT_COMMITTER_NAME: Operator
          GIT_COMMITTER_EMAIL: operator@example.org
          GIT_COMMITTER_DATE: '2026-01-01T00:00:00Z'
        run: |
          work="$RUNNER_TEMP/minimal"
          cp -R tests/fixtures/minimal "$work"
          # A Level-2 node publishes its ledger, which derives from a history (AGSC-10-04).
          (cd "$work" && git init -q -b main && git add -A && git commit -q -m fixture \
            && node "$GITHUB_WORKSPACE/bin/agsc.js" build)
          node tools/validate-wellknown "$work/www/.well-known/knowledge-linkset" --level 2
      - name: the release lane's own checks
        run: node tools/release --json
      - name: public means clean (the whole tree, not only what ships)
        run: node tools/public-hygiene
      - name: the architecture boundary lane
        env:
          AGSC_AUDIT: '1'
        run: node --test "tests/arch/*.test.js"

  actionlint:
    name: actionlint (the workflow files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch actionlint 1.7.12 and verify its checksum before it runs
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          sha="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" "$url"
          echo "$sha  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: every workflow file of this repository
        shell: bash
        # The shellcheck and pyflakes integrations are off so that the run here is the
        # same run a maintainer gets from the binary on one machine; turn them on once
        # their findings have been read.
        run: '"$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml'
