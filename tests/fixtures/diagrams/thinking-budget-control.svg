<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-labelledby="thinking-budget-control-title thinking-budget-control-desc" font-family="system-ui, sans-serif" font-size="14">
  <title id="thinking-budget-control-title">Thinking-budget control diagram</title>
  <desc id="thinking-budget-control-desc">reasoning tokens are billed as output — depth is a cost decision</desc>
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="18" y="100" width="92" height="44" rx="6"/>
    <rect x="140" y="92" width="118" height="60" rx="6" class="agsc-accent" stroke-width="2.2"/>
    <rect x="300" y="40" width="140" height="44" rx="6"/>
    <rect x="300" y="150" width="140" height="44" rx="6"/>
    <path d="M114 122 L136 122" marker-end="url(#ar2)"/>
    <path d="M261.8 100 L303.5 85.3" marker-end="url(#ar2)"/>
    <path d="M261.8 140.4 L296.2 150.4" marker-end="url(#ar2)"/>
    <path d="M300 100 L340 100"/>
    <path d="M300 210 L440 210"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="64" y="126" font-size="12">task</text>
    <text x="199" y="118" font-size="12">budget</text>
    <text x="199" y="134" font-size="12">allocator</text>
    <text x="370" y="66" font-size="12">low effort</text>
    <text x="370" y="176" font-size="12">high effort</text>
    <text x="300" y="118" font-size="11" text-anchor="start">few reasoning tokens</text>
    <text x="300" y="228" font-size="11" text-anchor="start">many reasoning tokens</text>
    <text x="230" y="248" font-size="11">reasoning tokens are billed as output — depth is a cost decision</text>
  </g>
