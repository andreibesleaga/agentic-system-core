<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-labelledby="a2a-title a2a-desc" font-family="system-ui, sans-serif" font-size="14">
  <title id="a2a-title">Agent-to-agent protocol diagram</title>
  <desc id="a2a-desc">both sides stay opaque — the card advertises capability, not implementation</desc>
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="16" y="60" width="150" height="140" rx="8" stroke-dasharray="6 4"/>
    <rect x="294" y="60" width="150" height="140" rx="8" stroke-dasharray="6 4"/>
    <rect x="40" y="110" width="102" height="42" rx="6"/>
    <rect x="318" y="110" width="102" height="42" rx="6"/>
    <rect x="178" y="100" width="104" height="62" rx="6" class="agsc-accent" stroke-width="2.2"/>
    <path d="M146 131 L174 131" marker-end="url(#ar2)"/>
    <path d="M286 131 L314 131" marker-end="url(#ar2)"/>
    <path d="M352.3 152 L330 180 L250 180 L242.7 162" marker-end="url(#ar2)" stroke-dasharray="4 3"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="91" y="52" font-size="11">org A</text>
    <text x="369" y="52" font-size="11">org B</text>
    <text x="91" y="135" font-size="12">agent</text>
    <text x="369" y="135" font-size="12">agent</text>
    <text x="230" y="127" font-size="12">agent card</text>
    <text x="230" y="143" font-size="12">+ task lifecycle</text>
    <text x="230" y="248" font-size="11">both sides stay opaque — the card advertises capability, not implementation</text>
  </g>
</svg>
