<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-labelledby="bulkhead-isolation-title bulkhead-isolation-desc" font-family="system-ui, sans-serif" font-size="14">
  <title id="bulkhead-isolation-title">Bulkhead isolation diagram</title>
  <desc id="bulkhead-isolation-desc">pool A fails fast on its own — B and C never notice</desc>
  <defs><marker id="bulkhead-isolation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="40" width="90" height="40" rx="6"/>
    <rect x="20" y="108" width="90" height="40" rx="6"/>
    <rect x="20" y="176" width="90" height="40" rx="6"/>
    <rect x="150" y="26" width="130" height="200" rx="8" stroke-dasharray="6 4"/>
    <rect x="165" y="40" width="100" height="40" rx="6" class="agsc-accent" stroke-width="2.2"/>
    <rect x="165" y="108" width="100" height="40" rx="6"/>
    <rect x="165" y="176" width="100" height="40" rx="6"/>
    <rect x="330" y="96" width="110" height="64" rx="6"/>
    <path d="M114 60 L161 60" marker-end="url(#bulkhead-isolation-arrow)"/>
    <path d="M114 128 L161 128" marker-end="url(#bulkhead-isolation-arrow)"/>
    <path d="M114 196 L161 196" marker-end="url(#bulkhead-isolation-arrow)"/>
    <path d="M268.7 81.5 L326.3 104.5" marker-end="url(#bulkhead-isolation-arrow)" stroke-dasharray="4 3"/>
    <path d="M269 128 L326 128" marker-end="url(#bulkhead-isolation-arrow)"/>
    <path d="M268.7 174.5 L326.3 151.5" marker-end="url(#bulkhead-isolation-arrow)"/>
    <path d="M292 80 L308 96 M308 80 L292 96" stroke-width="2"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="65" y="64" font-size="12">agent A</text>
    <text x="65" y="132" font-size="12">agent B</text>
    <text x="65" y="200" font-size="12">tenant C</text>
    <text x="215" y="18" font-size="11">bounded pool per consumer</text>
    <text x="215" y="56" font-size="12">pool A</text>
    <text x="215" y="72" font-size="12">saturated</text>
    <text x="215" y="132" font-size="12">pool B</text>
    <text x="215" y="200" font-size="12">pool C</text>
    <text x="385" y="124" font-size="12">shared model</text>
    <text x="385" y="140" font-size="12">/ tool service</text>
    <text x="230" y="248" font-size="11">pool A fails fast on its own — B and C never notice</text>
  </g>
</svg>
