<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-labelledby="maestro-threat-model-title maestro-threat-model-desc" font-family="system-ui, sans-serif" font-size="14">
  <title id="maestro-threat-model-title">MAESTRO seven-layer threat model diagram</title>
  <desc id="maestro-threat-model-desc">the layers are a checklist; the incidents live in the cross-layer arrow</desc>
  <defs><marker id="maestro-threat-model-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="40" y="20" width="260" height="24" rx="6"/>
    <rect x="40" y="50" width="260" height="24" rx="6"/>
    <rect x="40" y="80" width="260" height="24" rx="6"/>
    <rect x="40" y="110" width="260" height="24" rx="6"/>
    <rect x="40" y="140" width="260" height="24" rx="6"/>
    <rect x="40" y="170" width="260" height="24" rx="6"/>
    <rect x="40" y="200" width="260" height="24" rx="6"/>
    <rect x="330" y="96" width="110" height="56" rx="6" class="agsc-accent" stroke-width="2.2"/>
    <path d="M 330 124 L 312 150 L 312 182 L 302 182" marker-end="url(#maestro-threat-model-arrow)"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="170" y="36" font-size="12">7 agent ecosystem</text>
    <text x="170" y="66" font-size="11">6 security and compliance</text>
    <text x="170" y="96" font-size="11">5 evaluation and observability</text>
    <text x="170" y="126" font-size="11">4 deployment and infrastructure</text>
    <text x="170" y="156" font-size="12">3 agent frameworks</text>
    <text x="170" y="186" font-size="12">2 data operations</text>
    <text x="170" y="216" font-size="12">1 foundation models</text>
    <text x="385" y="120" font-size="12">cross-layer</text>
    <text x="385" y="136" font-size="12">threat</text>
    <text x="385" y="172" font-size="11">e.g. message at L3,</text>
    <text x="385" y="186" font-size="11">exfiltration at L2</text>
    <text x="230" y="248" font-size="11">the layers are a checklist; the incidents live in the cross-layer arrow</text>
  </g>
</svg>
