<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-labelledby="synthetic-coverage-title synthetic-coverage-desc" font-family="system-ui, sans-serif" font-size="14">
  <title id="synthetic-coverage-title">synthetic coverage diagram</title>
  <desc id="synthetic-coverage-desc">synthetic coverage diagram. A line drawing; the highlighted element carries the accent.</desc>
  <defs><marker id="synthetic-coverage-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="10" y="20" width="280" height="140" rx="8" stroke-dasharray="6 4"/>
    <rect x="30" y="60" width="80" height="40" rx="6" stroke-dasharray="5 3"/>
    <rect x="190" y="60" width="80" height="40" rx="6" class="agsc-accent" stroke-width="2.2" stroke-dasharray="4 3"/>
    <path d="M114 80 L186 80" marker-end="url(#synthetic-coverage-arrow)"/>
    <path d="M230 100 L230 140 L70 140 L70 100" marker-end="url(#synthetic-coverage-arrow)"/>
    <path d="M20 30 L280 30"/>
    <path d="M142 112 L158 128 M158 112 L142 128" stroke-width="2"/>
    <path d="M40 160 L140 160" stroke-width="5"/>
    <path d="M20 170 L60 170" marker-end="url(#synthetic-coverage-arrow)"/>
    <circle cx="150" cy="45" r="12"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="70" y="76" font-size="12">plain</text>
    <text x="70" y="92" font-size="12">box</text>
    <text x="230" y="84" font-size="12">accented dashed box</text>
    <text x="150" y="49" font-size="11">c</text>
    <text x="150" y="15" font-size="9">top label</text>
  </g>
</svg>
