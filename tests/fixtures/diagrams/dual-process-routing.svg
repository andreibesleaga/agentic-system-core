  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="16" y="104" width="70" height="44" rx="6"/>
    <rect x="120" y="96" width="110" height="60" rx="6" class="agsc-accent" stroke-width="2.2"/>
    <rect x="300" y="40" width="130" height="44" rx="6"/>
    <rect x="300" y="160" width="130" height="44" rx="6"/>
    <path d="M90 126 L116 126" marker-end="url(#ar2)"/>
