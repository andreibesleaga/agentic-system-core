<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-labelledby="dual-process-routing-title dual-process-routing-desc" font-family="system-ui, sans-serif" font-size="14">
  <title id="dual-process-routing-title">Dual-process routing diagram</title>
  <desc id="dual-process-routing-desc">dashed = slow-path results distilled into the fast path over time</desc>
